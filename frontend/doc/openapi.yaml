openapi: 3.0.3
info:
  title: Social Feed API
  version: 1.0.0
  description: |
    Transport contract for the social feed prototype. This document can be
    imported into Apidog to create the endpoints and Cloud Mock responses.

    The mock contract uses complete Post and Comment view models so the
    frontend can render loading, empty, error, media, reaction, bookmark,
    share, and nested comment states before the backend is implemented.

servers:
  - url: http://localhost:4000
    description: Local backend
  - url: https://mock.apidog.com/m1/1399961-1408603-default
    description: Apidog Cloud Mock

tags:
  - name: Feed
  - name: Posts
  - name: Comments
  - name: Interactions

paths:
  /api/v1/feed:
    get:
      tags: [Feed]
      summary: List the current user's feed
      operationId: listFeed
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FeedSort'
      responses:
        '200':
          description: A page of posts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
              examples:
                default:
                  $ref: '#/components/examples/FeedPageResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/posts:
    post:
      tags: [Posts]
      summary: Create a post
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
            example:
              content: Just shipped the revised component spec.
              attachments: []
              privacy: public
      responses:
        '201':
          description: The created post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                default:
                  $ref: '#/components/examples/PostResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Posts]
      summary: Get a post
      operationId: getPost
      responses:
        '200':
          description: The requested post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                default:
                  $ref: '#/components/examples/PostResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Posts]
      summary: Update a post
      operationId: updatePost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
            example:
              content: Updated post content.
              privacy: public
      responses:
        '200':
          description: The updated post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                default:
                  $ref: '#/components/examples/PostResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Posts]
      summary: Delete a post
      operationId: deletePost
      responses:
        '204':
          description: The post was deleted.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
    get:
      tags: [Comments]
      summary: List comments for a post
      operationId: listComments
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of comments and nested replies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
              examples:
                default:
                  $ref: '#/components/examples/CommentPageResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Comments]
      summary: Create a comment or reply
      operationId: createComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
            example:
              content: This is a useful update.
              parentCommentId: null
      responses:
        '201':
          description: The created comment or reply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
              examples:
                default:
                  $ref: '#/components/examples/CommentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    patch:
      tags: [Comments]
      summary: Update a comment or reply
      operationId: updateComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
            example:
              content: Edited comment content.
      responses:
        '200':
          description: The updated comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentResponse'
              examples:
                default:
                  $ref: '#/components/examples/CommentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Comments]
      summary: Delete a comment or reply
      operationId: deleteComment
      responses:
        '204':
          description: The comment was deleted.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/posts/{postId}/reaction:
    parameters:
      - $ref: '#/components/parameters/PostId'
    put:
      tags: [Interactions]
      summary: Set the viewer's post reaction
      operationId: setPostReaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetReactionRequest'
            example:
              type: like
      responses:
        '200':
          description: The post with updated reaction statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                default:
                  $ref: '#/components/examples/PostResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Interactions]
      summary: Remove the viewer's post reaction
      operationId: removePostReaction
      responses:
        '200':
          description: The post with updated reaction statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                default:
                  $ref: '#/components/examples/PostResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/posts/{postId}/bookmark:
    parameters:
      - $ref: '#/components/parameters/PostId'
    put:
      tags: [Interactions]
      summary: Bookmark a post
      operationId: bookmarkPost
      responses:
        '200':
          description: The post with updated bookmark state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                default:
                  $ref: '#/components/examples/PostResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Interactions]
      summary: Remove a post bookmark
      operationId: removePostBookmark
      responses:
        '200':
          description: The post with updated bookmark state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                default:
                  $ref: '#/components/examples/PostResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/posts/{postId}/share:
    parameters:
      - $ref: '#/components/parameters/PostId'
    post:
      tags: [Interactions]
      summary: Share a post
      operationId: sharePost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharePostRequest'
            example:
              message: Sharing this with the team.
              privacy: public
      responses:
        '201':
          description: The shared post with updated share statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                default:
                  $ref: '#/components/examples/PostResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: Number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    FeedSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [latest]
        default: latest
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        example: post_123
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        example: comment_456

  responses:
    ValidationError:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: The request contains invalid fields.
              fieldErrors:
                content:
                  - Add text or an image before submitting.
              requestId: req_123
    UnauthorizedError:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication is required.
              requestId: req_123
    ForbiddenError:
      description: The current user cannot perform this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: You do not have permission to update this resource.
              requestId: req_123
    NotFoundError:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: The requested resource was not found.
              requestId: req_123
    ConflictError:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: The requested interaction already exists.
              requestId: req_123
    InternalError:
      description: An unexpected server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Something went wrong.
              requestId: req_123

  schemas:
    Privacy:
      type: string
      enum: [public, friends, only_me]

    ReactionType:
      type: string
      enum: [like, love, haha, wow, sad, angry]

    UserBadge:
      type: string
      enum: [author, moderator, staff, verified, pro]

    User:
      type: object
      required: [id, name, username, avatarUrl, badges]
      properties:
        id:
          type: string
          example: user_1
        name:
          type: string
          example: Alex Morgan
        username:
          type: string
          example: alexm
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: https://i.pravatar.cc/150?img=12
        badges:
          type: array
          items:
            $ref: '#/components/schemas/UserBadge'

    MediaAttachment:
      type: object
      required: [id, type, url, altText, width, height]
      properties:
        id:
          type: string
          example: media_1
        type:
          type: string
          enum: [image]
        url:
          type: string
          format: uri
          description: Feed attachment URL served by the configured media host.
          example: https://cool-veto.us/
        altText:
          type: string
          example: A team reviewing the new component system.
        width:
          type: integer
          nullable: true
          example: 1200
        height:
          type: integer
          nullable: true
          example: 800

    MediaInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
        altText:
          type: string

    ReactionCounts:
      type: object
      additionalProperties: false
      properties:
        like:
          type: integer
          minimum: 0
        love:
          type: integer
          minimum: 0
        haha:
          type: integer
          minimum: 0
        wow:
          type: integer
          minimum: 0
        sad:
          type: integer
          minimum: 0
        angry:
          type: integer
          minimum: 0

    ReactionSummary:
      type: object
      required: [counts, total]
      properties:
        counts:
          $ref: '#/components/schemas/ReactionCounts'
        total:
          type: integer
          minimum: 0

    PostStats:
      type: object
      required: [reactions, comments, shares, bookmarks, views]
      properties:
        reactions:
          $ref: '#/components/schemas/ReactionSummary'
        comments:
          type: integer
          minimum: 0
        shares:
          type: integer
          minimum: 0
        bookmarks:
          type: integer
          minimum: 0
        views:
          type: integer
          minimum: 0

    ViewerPostState:
      type: object
      required: [reaction, bookmarked, canEdit, canDelete]
      properties:
        reaction:
          allOf:
            - $ref: '#/components/schemas/ReactionType'
          nullable: true
        bookmarked:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean

    Post:
      type: object
      required:
        - id
        - author
        - content
        - attachments
        - createdAt
        - updatedAt
        - privacy
        - stats
        - viewer
      properties:
        id:
          type: string
          example: post_123
        author:
          $ref: '#/components/schemas/User'
        content:
          type: string
          nullable: true
          example: Just shipped the revised component spec.
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MediaAttachment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        privacy:
          $ref: '#/components/schemas/Privacy'
        stats:
          $ref: '#/components/schemas/PostStats'
        viewer:
          $ref: '#/components/schemas/ViewerPostState'

    CommentStats:
      type: object
      required: [reactions, replies]
      properties:
        reactions:
          $ref: '#/components/schemas/ReactionSummary'
        replies:
          type: integer
          minimum: 0

    ViewerCommentState:
      type: object
      required: [reaction, canEdit, canDelete]
      properties:
        reaction:
          allOf:
            - $ref: '#/components/schemas/ReactionType'
          nullable: true
        canEdit:
          type: boolean
        canDelete:
          type: boolean

    Comment:
      type: object
      required:
        - id
        - postId
        - parentCommentId
        - author
        - content
        - attachments
        - createdAt
        - updatedAt
        - stats
        - viewer
      properties:
        id:
          type: string
          example: comment_456
        postId:
          type: string
          example: post_123
        parentCommentId:
          type: string
          nullable: true
          example: null
        author:
          $ref: '#/components/schemas/User'
        content:
          type: string
          nullable: true
          example: This is a useful update.
        attachments:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/MediaAttachment'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        stats:
          $ref: '#/components/schemas/CommentStats'
        viewer:
          $ref: '#/components/schemas/ViewerCommentState'

    Pagination:
      type: object
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: string
          nullable: true
          example: cursor_abc
        hasMore:
          type: boolean
          example: true

    FeedPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CommentPage:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        pagination:
          $ref: '#/components/schemas/Pagination'

    PostResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Post'

    CommentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Comment'

    CreatePostRequest:
      type: object
      required: [privacy]
      properties:
        content:
          type: string
          nullable: true
          minLength: 1
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/MediaInput'
        privacy:
          $ref: '#/components/schemas/Privacy'

    UpdatePostRequest:
      type: object
      properties:
        content:
          type: string
          nullable: true
          minLength: 1
        attachments:
          type: array
          maxItems: 10
          description: Replaces the complete image selection when provided.
          items:
            $ref: '#/components/schemas/MediaInput'
        privacy:
          $ref: '#/components/schemas/Privacy'

    CreateCommentRequest:
      type: object
      properties:
        content:
          type: string
          nullable: true
          minLength: 1
        attachments:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/MediaInput'
        parentCommentId:
          type: string
          nullable: true
          description: Null creates a root comment; an ID creates a reply.

    UpdateCommentRequest:
      type: object
      properties:
        content:
          type: string
          nullable: true
          minLength: 1
        attachments:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/MediaInput'

    SetReactionRequest:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ReactionType'

    SharePostRequest:
      type: object
      required: [privacy]
      properties:
        message:
          type: string
          nullable: true
        privacy:
          $ref: '#/components/schemas/Privacy'

    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            requestId:
              type: string

  examples:
    FeedPageResponse:
      summary: Feed page with one text-and-image post
      value:
        data:
          - id: post_123
            author:
              id: user_1
              name: Alex Morgan
              username: alexm
              avatarUrl: https://i.pravatar.cc/150?img=12
              badges: [author, verified]
            content: Just shipped the revised component spec.
            attachments:
              - id: media_1
                type: image
                url: https://cool-veto.us/
                altText: A team reviewing the new component system.
                width: 1200
                height: 800
            createdAt: '2026-10-17T18:30:00Z'
            updatedAt: '2026-10-17T18:30:00Z'
            privacy: public
            stats:
              reactions:
                counts:
                  like: 142
                  love: 18
                total: 160
              comments: 24
              shares: 18
              bookmarks: 45
              views: 3400
            viewer:
              reaction: like
              bookmarked: false
              canEdit: true
              canDelete: true
        pagination:
          nextCursor: cursor_abc
          hasMore: true

    PostResponse:
      summary: Single post response
      value:
        data:
          id: post_123
          author:
            id: user_1
            name: Alex Morgan
            username: alexm
            avatarUrl: https://i.pravatar.cc/150?img=12
            badges: [author, verified]
          content: Just shipped the revised component spec.
          attachments: []
          createdAt: '2026-10-17T18:30:00Z'
          updatedAt: '2026-10-17T18:30:00Z'
          privacy: public
          stats:
            reactions:
              counts:
                like: 142
              total: 142
            comments: 24
            shares: 18
            bookmarks: 45
            views: 3400
          viewer:
            reaction: like
            bookmarked: false
            canEdit: true
            canDelete: true

    CommentPageResponse:
      summary: Comment page with a nested reply
      value:
        data:
          - id: comment_456
            postId: post_123
            parentCommentId: null
            author:
              id: user_2
              name: Maya Chen
              username: mayac
              avatarUrl: https://i.pravatar.cc/150?img=32
              badges: []
            content: This is a useful update.
            attachments: []
            createdAt: '2026-10-17T19:00:00Z'
            updatedAt: '2026-10-17T19:00:00Z'
            stats:
              reactions:
                counts:
                  like: 4
                total: 4
              replies: 1
            viewer:
              reaction: null
              canEdit: false
              canDelete: false
          - id: comment_789
            postId: post_123
            parentCommentId: comment_456
            author:
              id: user_3
              name: Jordan Lee
              username: jordanl
              avatarUrl: null
              badges: [pro]
            content: Agreed, especially the reusable primitives.
            attachments: []
            createdAt: '2026-10-17T19:10:00Z'
            updatedAt: '2026-10-17T19:10:00Z'
            stats:
              reactions:
                counts: {}
                total: 0
              replies: 0
            viewer:
